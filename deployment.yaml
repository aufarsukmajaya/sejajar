# Resonate on Kubernetes: kubectl apply -f deployment.yaml
#
# Change the lines marked CHANGE ME: the image and the two secrets.
# Expose port 8090 (named http) with your own Service and Ingress, at the root
# of a host; GitLab sign-in redirects to https://<host>/auth/callback.
# The database must already exist; Resonate creates its own tables on start.
# On first start the admin password is printed once:
#   kubectl -n resonate logs deploy/resonate | grep 'first run'
apiVersion: v1
kind: Namespace
metadata:
  name: resonate
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: resonate
  namespace: resonate
type: Opaque
stringData:
  # CHANGE ME: postgres://user:password@host:5432/resonate?sslmode=require
  DATABASE_URL: postgres://resonate:CHANGE-ME@postgres:5432/resonate?sslmode=disable
  # CHANGE ME: personal access token with the api scope (+ k8s_proxy for pod checks)
  GITLAB_TOKEN: glpat-CHANGE-ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resonate
  namespace: resonate
  labels:
    app: resonate
spec:
  replicas: 1 # the shared snapshot and the token-refresh lock are per process
  selector:
    matchLabels:
      app: resonate
  template:
    metadata:
      labels:
        app: resonate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resonate
          image: registry.example.com/resonate:latest # CHANGE ME: push the `make docker` image here
          args: ["serve"]
          envFrom:
            - secretRef:
                name: resonate
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
