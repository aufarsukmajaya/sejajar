# A deploy pipeline sejajar can drive, for an app repo with many services.
# Sejajar creates one pipeline per (site, service) cell on the branch, with
# the inputs set in Settings, e.g.:
#
#   SITE={site}  SERVICE={service}  POSTFIX={postfix}
#
# The deploy job must record a GitLab environment named like Settings'
# environment template ("{site}-{service}{postfix}" here). That is how sejajar
# knows what each worker and job runs, since they expose no /version.
#
# Assumes: the build stage pushes $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA;
# a GitLab agent per site named like the site; and, for APIs, a suspended
# CronJob "<service>-migrate" as the migration Job template.

spec:
  inputs:
    SITE:
      default: ""
    SERVICE:
      default: ""
    POSTFIX:
      default: ""
---
variables:
  SITE: $[[ inputs.SITE ]]
  SERVICE: $[[ inputs.SERVICE ]]
  POSTFIX: $[[ inputs.POSTFIX ]]

deploy:
  stage: deploy
  image: bitnami/kubectl:1.31
  rules:
    - if: $SITE != "" && $SERVICE != ""
  resource_group: $SITE-$SERVICE$POSTFIX    # one deploy per cell at a time
  environment:
    name: $SITE-$SERVICE$POSTFIX            # = Settings' environment template
  variables:
    NS: app
    NAME: $SERVICE$POSTFIX                  # a postfix is its own deployment
    IMG: $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
  script:
    - kubectl config use-context "$CI_PROJECT_PATH:$SITE"
    # APIs migrate first (the old code keeps running against the additive schema)
    - |
      if [ "${SERVICE#api-}" != "$SERVICE" ]; then
        kubectl -n $NS set image cronjob/$NAME-migrate migrate=$IMG
        kubectl -n $NS create job "$NAME-migrate-$CI_PIPELINE_ID" --from=cronjob/$NAME-migrate
        kubectl -n $NS wait --for=condition=complete --timeout=15m job/"$NAME-migrate-$CI_PIPELINE_ID"
      fi
    - kubectl -n $NS set image deployment/$NAME app=$IMG
    - kubectl -n $NS rollout status deployment/$NAME --timeout=10m
